# Its own workspace, apart from the server's in the repository root, so
# it stays when the server moves out (#306).
[workspace]

[package]
name = "ankiquest-package-addon"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
description = "Builds the desktop add-on archive for PR checks, GitHub releases and AnkiWeb"
publish = false

[[bin]]
name = "package-addon"
path = "src/main.rs"

[dependencies]
crc32fast = "1"
libz-sys = { version = "1", features = ["static"] }
serde = "1"
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
flate2 = "1"
tempfile = "3"
