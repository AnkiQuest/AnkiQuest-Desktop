[package]
name = "ankiquest-banner"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
description = "The README banner and the social preview, drawn from the desktop screenshots"
publish = false

[[bin]]
name = "banner"
path = "src/main.rs"

# A workspace of its own, so it stays when the server workspace leaves (#306).
[workspace]

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
resvg = { version = "0.50", default-features = false, features = ["text"] }
