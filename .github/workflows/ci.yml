name: CI

on:
  # Pushes to the default branch, every pull request and every merge queue
  # group. Pushes to other branches are left to their pull request: checking
  # both ran every job twice on the same commit.
  push:
    branches:
      - master
  pull_request:
  # The jobs here are required checks; the merge queue waits for them on
  # its temporary merge commit.
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to a pull request cancels its older run. Every other run
  # (default branch pushes, dispatches, merge queue) gets a group of its own
  # and always finishes.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Whether anything besides documentation changed. Docs here are the
  # top-level and docs/ Markdown: the .md files in addon/ are packaged and
  # tested, and docs/graphics is compared by the banner check.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # code-changed lists the pull request's files
    outputs:
      code: ${{ steps.changed.outputs.code }}
    steps:
      - id: changed
        uses: AnkiQuest/AnkiQuest-Dev/.github/actions/code-changed@master
        with:
          docs: |
            *.md
            docs/*.md
            LICENSE*
            LICENSES/**
            .github/ISSUE_TEMPLATE/**
            .github/pull_request_template.md

  desktop:
    name: Desktop (Anki ${{ matrix.anki }})
    needs: changes
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - anki: '24.11'
            python: '3.9'
          - anki: '26.9.4'
            python: '3.12'
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
      # The packager keeps the pinned Art release's assets here (docs/desktop.md).
      ANKIQUEST_ART_CACHE: ${{ github.workspace }}/../ankiquest-art
    steps:
      # The matrix names are required checks, and a skipped matrix job
      # reports under its unexpanded name, so the job runs and skips its
      # steps when only documentation changed.
      - name: Skip, only documentation changed
        if: needs.changes.outputs.code != 'true'
        run: echo "Only documentation changed; the add-on checks are skipped."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code == 'true'
        with:
          persist-credentials: false
      # The real-Anki smoke installs archives from the Rust packager.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: needs.changes.outputs.code == 'true'
        with:
          workspaces: tools/package-addon
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: needs.changes.outputs.code == 'true'
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: tests/requirements-anki-${{ matrix.anki }}.txt
      - name: Install Anki and Qt
        if: needs.changes.outputs.code == 'true'
        env:
          ANKI_VERSION: ${{ matrix.anki }}
        run: |
          bash .github/scripts/ubuntu-archive.sh
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libfontconfig1 libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxkbfile1 libasound2t64
          python -m pip install -r "tests/requirements-anki-$ANKI_VERSION.txt"
      - name: Build the add-on packager
        if: needs.changes.outputs.code == 'true'
        run: cargo build --locked --manifest-path tools/package-addon/Cargo.toml
      # The tests read AnkiQuest-Server master's shared fixtures and API
      # examples (docs/desktop.md, Server data).
      - name: Fetch the server's fixtures and examples
        if: needs.changes.outputs.code == 'true'
        run: cargo run --locked --manifest-path tools/package-addon/Cargo.toml -- server-data
      # The tests read the companion pictures of the pinned AnkiQuest-Art release,
      # downloaded once per pin: the packager checks each asset's SHA-256
      # against the pin before use, so a cached file can't change a picture.
      - name: Restore the Art release download
        if: needs.changes.outputs.code == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.ANKIQUEST_ART_CACHE }}
          key: ankiquest-art-${{ hashFiles('ankiquest-art.json') }}
      - name: Fetch the companion pictures
        if: needs.changes.outputs.code == 'true'
        run: cargo run --locked --manifest-path tools/package-addon/Cargo.toml -- art
      - name: Lint the add-on
        if: needs.changes.outputs.code == 'true'
        run: python -m pyflakes addon
      - name: Test the add-on and its real Anki APIs
        if: needs.changes.outputs.code == 'true'
        run: python -m unittest discover -s tests -v

  # The screenshots are not committed. screenshot_store.yml stores each
  # master commit's drawing as the screenshot-baseline artifact; this job
  # draws the screens again and compares them with the baseline of the
  # commit the change is based on, waiting while that is still being
  # stored. A screen change fails here by design: its diff is the
  # screenshots artifact. Not a required check.
  screenshots:
    name: Screenshots
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # The pictures are drawn by this Ubuntu and the Qt of the 26.9.4 requirements.
    runs-on: ubuntu-24.04
    # A master push waits for its own baseline, stored by a run that starts with it.
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read # the store runs and their baseline artifact
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
      ANKIQUEST_ART_CACHE: ${{ github.workspace }}/../ankiquest-art
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Find the base commit's screenshot baseline
        id: baseline
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const baseline = require('./.github/screenshot_baseline.cjs');
            return await baseline({ github, context, core, dir: `${process.env.RUNNER_TEMP}/baseline` });
      - name: Download the screenshot baseline
        if: steps.baseline.outputs.run-id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: screenshot-baseline
          run-id: ${{ steps.baseline.outputs.run-id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/baseline
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements-anki-26.9.4.txt
      - name: Install Anki and Qt
        run: |
          bash .github/scripts/ubuntu-archive.sh
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libfontconfig1 libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxkbfile1 libasound2t64
          python -m pip install -r tests/requirements-anki-26.9.4.txt
      - name: Restore the Art release download
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.ANKIQUEST_ART_CACHE }}
          key: ankiquest-art-${{ hashFiles('ankiquest-art.json') }}
      - name: Fetch the companion pictures
        run: cargo run --locked --manifest-path tools/package-addon/Cargo.toml -- art
      - name: Compare the screenshots with the baseline
        env:
          ANKIQUEST_SCREENSHOTS_BASELINE: ${{ runner.temp }}/baseline
          BASE: ${{ steps.baseline.outputs.base }}
        run: |
          echo "Comparing with the screenshot baseline of $BASE" >> "$GITHUB_STEP_SUMMARY"
          python tests/draw_screenshots.py -v
      # This commit's drawings: the banner job draws from them, and after a
      # failure they are the new screens to review.
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: build/screenshots/
          retention-days: 30
          if-no-files-found: ignore

  # The README banner and social preview, drawn from this commit's
  # screenshots and the duo master of the pinned AnkiQuest-Art release by
  # AnkiQuest-Dev's shared tool (docs/graphics/banner.toml). It runs when
  # the screenshots differ from the baseline too: the banner follows the
  # drawing, not the baseline.
  banner:
    needs: [changes, screenshots]
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' && needs.screenshots.result != 'skipped' }}
    uses: AnkiQuest/AnkiQuest-Dev/.github/workflows/banner.yml@master
    with:
      screens-artifact: screenshots
      screens-path: build/screenshots

  # The workflows' own scripts (.github/tests).
  workflow-tests:
    name: Workflow tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Test the workflow scripts
        run: node --test '.github/tests/*.test.cjs'

  addon-package:
    name: Add-on archive
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    env:
      PACKAGER: tools/package-addon/Cargo.toml
      ANKIQUEST_ART_CACHE: ${{ github.workspace }}/../ankiquest-art
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: tools/package-addon
      - name: Restore the Art release download
        id: art-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.ANKIQUEST_ART_CACHE }}
          key: ankiquest-art-${{ hashFiles('ankiquest-art.json') }}
      # The archive test checks the built .ankiaddon carries Art's poses.json.
      - name: Fetch the companion pictures
        run: cargo run --locked --manifest-path "$PACKAGER" -- art
      - name: Check the packager
        run: |
          cargo fmt --all --manifest-path "$PACKAGER" --check
          cargo clippy --workspace --locked --manifest-path "$PACKAGER" --all-targets -- -D warnings
          cargo test --locked --manifest-path "$PACKAGER"
      - name: Build the archive
        run: |
          cargo run --locked --manifest-path "$PACKAGER" -- --updates github --output ankiquest-24.11.ankiaddon
          cargo run --locked --manifest-path "$PACKAGER" -- --ankiweb --output ankiquest-ankiweb.ankiaddon
      # Only master writes the download cache; pull requests and merge
      # groups read it, so no branch can seed what master's jobs restore.
      - name: Save the Art release download
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.art-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.ANKIQUEST_ART_CACHE }}
          key: ankiquest-art-${{ hashFiles('ankiquest-art.json') }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ankiquest-addon
          path: ankiquest-24.11.ankiaddon
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ankiquest-ankiweb-addon
          path: ankiquest-ankiweb.ankiaddon
          if-no-files-found: error
