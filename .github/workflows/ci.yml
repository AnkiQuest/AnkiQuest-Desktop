name: CI

on:
  # Pushes to the default branch, every pull request and every merge queue
  # group. Pushes to other branches are left to their pull request: checking
  # both ran every job twice on the same commit.
  push:
    branches:
      - master
  pull_request:
  # The jobs here are required checks; the merge queue waits for them on
  # its temporary merge commit.
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to a pull request cancels its older run. Every other run
  # (default branch pushes, dispatches, merge queue) gets a group of its own
  # and always finishes.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Whether anything besides documentation changed. Docs here are the
  # top-level and docs/ Markdown and the pictures nothing checks: the .md
  # files in addon/ are packaged and tested, and docs/screenshots and
  # docs/graphics are compared by the screenshot test and the banner check.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.changed.outputs.code }}
    steps:
      - id: changed
        uses: AnkiQuest/AnkiQuest-Dev/.github/actions/code-changed@5ab685e7013b865630f96530ca8c654344738fa8
        with:
          docs: |
            *.md
            docs/*.md
            docs/desktop-share/**
            docs/qa/**
            LICENSE*
            LICENSES/**
            .github/ISSUE_TEMPLATE/**
            .github/pull_request_template.md

  desktop:
    name: Desktop (Anki ${{ matrix.anki }})
    needs: changes
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - anki: '23.10'
            python: '3.9'
          - anki: '26.9.4'
            python: '3.12'
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      # The matrix names are required checks, and a skipped matrix job
      # reports under its unexpanded name, so the job runs and skips its
      # steps when only documentation changed.
      - name: Skip, only documentation changed
        if: needs.changes.outputs.code != 'true'
        run: echo "Only documentation changed; the add-on checks are skipped."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.changes.outputs.code == 'true'
        with:
          persist-credentials: false
      # The tests read copies of AnkiQuest-Server's shared fixtures and API
      # examples, pinned to the commit in tests/ankiquest-server.sha. Each
      # copy must equal the file at that commit (docs/desktop.md, Server
      # snapshot).
      - name: Read the pinned server commit
        if: needs.changes.outputs.code == 'true'
        id: server
        run: echo "sha=$(cat tests/ankiquest-server.sha)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.changes.outputs.code == 'true'
        with:
          repository: AnkiQuest/AnkiQuest-Server
          ref: ${{ steps.server.outputs.sha }}
          path: server-snapshot
          sparse-checkout: |
            /tests/fixtures/
            /docs/api/examples/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Check the copies of the server's fixtures and examples
        if: needs.changes.outputs.code == 'true'
        run: |
          for copy in tests/fixtures/*.json; do cmp "$copy" "server-snapshot/$copy"; done
          for copy in tests/api-examples/*.json; do cmp "$copy" "server-snapshot/docs/api/examples/${copy##*/}"; done
      # The real-Anki smoke installs archives from the Rust packager.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: needs.changes.outputs.code == 'true'
        with:
          workspaces: tools/package-addon
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: needs.changes.outputs.code == 'true'
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: tests/requirements-anki-${{ matrix.anki }}.txt
      - name: Install Anki and Qt
        if: needs.changes.outputs.code == 'true'
        run: |
          bash .github/scripts/ubuntu-archive.sh
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libfontconfig1 libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxkbfile1 libasound2t64
          python -m pip install -r tests/requirements-anki-${{ matrix.anki }}.txt
      - name: Build the add-on packager
        if: needs.changes.outputs.code == 'true'
        run: cargo build --locked --manifest-path tools/package-addon/Cargo.toml
      # The tests read the companion pictures of the pinned AnkiQuest-Art release.
      - name: Fetch the companion pictures
        if: needs.changes.outputs.code == 'true'
        run: cargo run --locked --manifest-path tools/package-addon/Cargo.toml -- art
      # The heatmap, the day verdict and their tests run the shared rules
      # of the release ankiquest-rules.json pins.
      - name: Fetch the shared rules
        if: needs.changes.outputs.code == 'true'
        run: cargo run --locked --manifest-path tools/package-addon/Cargo.toml -- rules
      - name: Lint the add-on
        if: needs.changes.outputs.code == 'true'
        # Only the add-on's own files: the rules bindings are generated.
        run: python -m pyflakes $(git ls-files 'addon/*.py')
      - name: Test the add-on and its real Anki APIs
        if: needs.changes.outputs.code == 'true'
        run: python -m unittest discover -s tests -v

  screenshots:
    name: Screenshots
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # The committed pictures are drawn by this Ubuntu and the Qt of the 26.9.4 requirements.
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements-anki-26.9.4.txt
      - name: Install Anki and Qt
        run: |
          bash .github/scripts/ubuntu-archive.sh
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libfontconfig1 libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxkbfile1 libasound2t64
          python -m pip install -r tests/requirements-anki-26.9.4.txt
      - name: Fetch the companion pictures
        run: cargo run --locked --manifest-path tools/package-addon/Cargo.toml -- art
      - name: Fetch the shared rules
        run: cargo run --locked --manifest-path tools/package-addon/Cargo.toml -- rules
      - name: Compare the screenshots with a fresh drawing
        env:
          ANKIQUEST_SCREENSHOTS_OUT: ${{ runner.temp }}/screenshots
        run: python tests/draw_screenshots.py -v
      - name: Keep the screenshots that differ
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: ignore

  # The README banner and social preview, drawn from the committed
  # screenshots and the duo master at the pinned server commit by
  # AnkiQuest-Dev's shared tool (docs/graphics/banner.toml).
  banner:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: AnkiQuest/AnkiQuest-Dev/.github/workflows/banner.yml@master
    with:
      server-sha-file: tests/ankiquest-server.sha

  addon-package:
    name: Add-on archive
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    env:
      PACKAGER: tools/package-addon/Cargo.toml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: tools/package-addon
      - name: Check the packager
        run: |
          cargo fmt --all --manifest-path "$PACKAGER" --check
          cargo clippy --workspace --locked --manifest-path "$PACKAGER" --all-targets -- -D warnings
          cargo test --locked --manifest-path "$PACKAGER"
      - name: Build the archive
        run: |
          cargo run --locked --manifest-path "$PACKAGER" -- --updates github --output ankiquest.ankiaddon
          cargo run --locked --manifest-path "$PACKAGER" -- --ankiweb --output ankiquest-ankiweb.ankiaddon
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ankiquest-addon
          path: ankiquest.ankiaddon
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ankiquest-ankiweb-addon
          path: ankiquest-ankiweb.ankiaddon
          if-no-files-found: error
