name: Desktop add-on

on:
  push:
    tags: ["addon-*"]
    branches: [master]
    paths: ["addon/**", "ankiquest-art.json", ".github/workflows/addon.yml", "tools/package-addon/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: addon-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates the release and replaces the nightly one
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # The archives take the newest AnkiQuest-Server rules release and
      # record its tag. No Rust cache: a release is built from a clean
      # registry and target, so a cache a pull request wrote can't reach the
      # published archive.
      - name: Version
        id: version
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # The GitHub release updates itself from GitHub releases. Its names carry the minimum
          # Anki (updates.BUILDS): copies on an older Anki never see them.
          cargo run --locked --manifest-path tools/package-addon/Cargo.toml -- --updates github --output ankiquest-24.11.ankiaddon \
            --ref "$GITHUB_REF" --metadata addon-nightly-24.11.json
          echo "release=$(jq -r .release addon-nightly-24.11.json)" >> "$GITHUB_OUTPUT"
          # The same build for the AnkiWeb listing: its package ID and conflicts differ, and
          # --ankiweb turns self-updates off (--updates none), since AnkiWeb updates add-ons itself.
          cargo run --locked --manifest-path tools/package-addon/Cargo.toml -- --ankiweb --output ankiquest-ankiweb.ankiaddon \
            --ref "$GITHUB_REF"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/addon-')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The add-on shows these notes in its AnkiQuest changelog; GitHub adds how to install.
          INSTALL: "Needs Anki 24.11 or newer. Double-click ankiquest-24.11.ankiaddon or choose Tools → Add-ons → Install from file, then restart Anki. Sign in or create an account when AnkiQuest asks, or later from Tools → AnkiQuest: sign in or create account. Passwords are sent only over HTTPS unless the server is on your local network. Switch account, Sign out and Manual connection (server, player and token) are in Tools → AnkiQuest settings. ankiquest-ankiweb.ankiaddon is the upload for the AnkiWeb listing; do not install it next to ankiquest-24.11.ankiaddon."
        run: |
          { cat addon/release-notes.md; printf '\n%s\n' "$INSTALL"; } > release-notes.md
          gh release create "$GITHUB_REF_NAME" ankiquest-24.11.ankiaddon ankiquest-ankiweb.ankiaddon \
            --title "Desktop add-on ${GITHUB_REF_NAME#addon-}" \
            --notes-file release-notes.md

      - name: Stage legacy nightly files
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Copies older than the bridge release read only ankiquest.ankiaddon and addon-nightly.json.
          # Keep both on the last Anki 23.10 release: the highest addon-<n> release that has
          # ankiquest.ankiaddon, since later releases publish only the 24.11 names.
          bridge=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" | jq -r '[.[][]
            | select((.tag_name | test("^addon-[1-9][0-9]*$")) and (.draft | not) and (.prerelease | not))
            | select(any(.assets[]; .name == "ankiquest.ankiaddon"))
            | .tag_name | ltrimstr("addon-") | tonumber] | max // empty')
          test -n "$bridge"
          mkdir legacy
          gh release download "addon-$bridge" --pattern ankiquest.ankiaddon --dir legacy
          jq -n --argjson release "$bridge" '{release: $release, nightly: 0, commit: ""}' > legacy/addon-nightly.json

      # Update both sets of downloads together, keeping the release URL in place.
      - name: Publish nightly
        if: github.ref == 'refs/heads/master'
        uses: AnkiQuest/AnkiQuest-Dev/.github/actions/nightly-release@master
        with:
          tag: addon-nightly
          title: Desktop add-on nightly
          notes: "Built from ${{ github.sha }} after addon-${{ steps.version.outputs.release }}. Untested: choose the nightly update channel in ankiquest settings to get these."
          files: |
            ankiquest-24.11.ankiaddon
            ankiquest-ankiweb.ankiaddon
            addon-nightly-24.11.json
            legacy/ankiquest.ankiaddon
            legacy/addon-nightly.json
