name: Companion art exports

on:
  pull_request:
    paths:
      - 'static/aki/**'
      - 'static/ankilope/**'
      - 'static/anki-tan/**'
      - 'static/bluma/**'
      - 'static/cow/**'
      - 'crates/art/**'
      - 'crates/xtask/**'
      - 'Cargo.lock'
      - '.github/workflows/art-exports.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    name: Generate companion art exports
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Export both clients with the repository tools
        run: |
          cargo run --locked -p ankiquest-xtask -- export-addon-art
          cargo run --locked -p ankiquest-xtask -- export-android-art art-exports/android
          git diff --binary -- addon crates/xtask/art-exports.json assets/retired > art-exports/changes.patch
      - name: Store exports for review and commit
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: companion-art-exports
          path: |
            addon/art/
            addon/aki_face.png
            addon/ankilope_face.png
            crates/xtask/art-exports.json
            assets/retired/
            art-exports/
          if-no-files-found: error
          retention-days: 7
