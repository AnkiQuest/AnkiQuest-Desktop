name: Companion art exports

# The add-on's poses are exports of the masters in AnkiQuest-Server's
# static/, written by its export-addon-art from this repository's
# art-exports.json. This job checks them against the server commit in
# tests/ankiquest-server.sha and, when they differ, uploads a fresh export.

on:
  pull_request:
    paths:
      - 'addon/art/**'
      - 'addon/*_face.png'
      - 'art-exports.json'
      - 'assets/retired/**'
      - 'tests/ankiquest-server.sha'
      - '.github/workflows/art-exports.yml'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels its older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  export:
    name: Check companion art exports
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: desktop
      - name: Read the pinned server commit
        id: server
        run: echo "sha=$(cat desktop/tests/ankiquest-server.sha)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: AnkiQuest/AnkiQuest-Server
          ref: ${{ steps.server.outputs.sha }}
          path: server
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: server
      - name: Check the poses against the server's masters
        run: cargo run --locked --manifest-path server/Cargo.toml -p ankiquest-xtask -- export-addon-art --check "$GITHUB_WORKSPACE/desktop"

      # A failed check leaves a fresh export to review and commit.
      - name: Export the poses
        if: failure()
        run: |
          cargo run --locked --manifest-path server/Cargo.toml -p ankiquest-xtask -- export-addon-art "$GITHUB_WORKSPACE/desktop"
          mkdir -p art-exports
          git -C desktop add -A addon art-exports.json assets/retired
          git -C desktop diff --cached --binary > art-exports/changes.patch
      - name: Store the export
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: companion-art-exports
          path: art-exports/
          if-no-files-found: error
          retention-days: 7
