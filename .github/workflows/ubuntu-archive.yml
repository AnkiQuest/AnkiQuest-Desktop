name: Ubuntu mirror selector

on:
  push:
    branches: [master]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirrors:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: tools/package-addon
      # Uses local HTTP responses and real curl; does not install apt packages.
      - run: cargo test --locked --manifest-path tools/package-addon/Cargo.toml --test ubuntu_archive
