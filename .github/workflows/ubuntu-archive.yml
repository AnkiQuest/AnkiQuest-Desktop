name: Ubuntu mirror selector

on:
  push:
    branches: [master]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels its older run; default branch
# pushes and merge queue groups always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Whether anything besides documentation changed (the same docs globs
  # as ci.yml). The check runs in merge groups, so it skips its job
  # instead of filtering paths.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.changed.outputs.code }}
    steps:
      - id: changed
        uses: AnkiQuest/AnkiQuest-Dev/.github/actions/code-changed@5ab685e7013b865630f96530ca8c654344738fa8
        with:
          docs: |
            *.md
            docs/*.md
            docs/desktop-share/**
            docs/qa/**
            LICENSE*
            LICENSES/**
            .github/ISSUE_TEMPLATE/**
            .github/pull_request_template.md

  mirrors:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: tools/package-addon
      # Uses local HTTP responses and real curl; does not install apt packages.
      - run: cargo test --locked --manifest-path tools/package-addon/Cargo.toml --test ubuntu_archive
